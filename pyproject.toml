[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-privacy"
version = "0.1.0"
description = "Utilities for ..."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_privacy*"]
